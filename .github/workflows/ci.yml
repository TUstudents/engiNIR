name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python to the newest release.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --all-extras
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src/enginir tests docs/examples
      - name: Types
        run: uv run pyright src/enginir
      - name: Docs
        run: uv run python -m sphinx -W -E -b html docs docs/_build/html
