name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --all-extras
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src/enginir tests docs/examples
      - name: Types
        run: uv run pyright src/enginir
      - name: Docs
        run: uv run python -m sphinx -W -E -b html docs docs/_build/html
