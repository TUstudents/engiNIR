name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hang must not wait for GitHub's 6-hour limit
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python to the newest release.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3  # no major tags since v8: pin the release
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --all-extras
      - name: Tests
        # A hang outside a test (e.g. at shutdown) is not covered by the per-test
        # timeout: after 15 minutes, abort with faulthandler's stack of every thread.
        run: timeout -s ABRT 900 uv run python -X faulthandler -m pytest -q
      - name: Lint
        run: uv run ruff check src/enginir tests docs/examples
      - name: Types
        run: uv run pyright src/enginir
      - name: Docs
        run: uv run python -m sphinx -W -E -b html docs docs/_build/html

  windows:
    # The viewer is installed on Windows by PAT users (plan windows-1.5.2); the
    # suite runs there on the Python the installer uses. Lint, types and docs
    # give the same result everywhere and run only on Linux.
    runs-on: windows-latest
    timeout-minutes: 30  # also covers a hang outside a test (no GNU timeout here)
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - name: Tests
        run: uv run python -X faulthandler -m pytest -q
