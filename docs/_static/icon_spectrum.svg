<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!--
    engiNIR  —  Spectrum Stripes icon
    5 vertical colour bars (deep red → amber) with a white NIR
    absorption fingerprint curve overlaid.
  -->
  <defs>
    <clipPath id="roundedClip">
      <rect width="300" height="300" rx="28"/>
    </clipPath>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   style="stop-color:#FFFFFF;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.22"/>
    </radialGradient>
    <!-- Soft glow behind the curve so it pops off the amber bars -->
    <filter id="curveGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- Colour bars -->
    <rect x="0"   y="0" width="60" height="300" fill="#B22B1E"/>
    <rect x="60"  y="0" width="60" height="300" fill="#CC4A18"/>
    <rect x="120" y="0" width="60" height="300" fill="#DF7010"/>
    <rect x="180" y="0" width="60" height="300" fill="#E8960E"/>
    <rect x="240" y="0" width="60" height="300" fill="#F2BC0C"/>

    <!-- Vignette -->
    <rect width="300" height="300" fill="url(#vignette)"/>

    <!--
      NIR absorption curve — stylised fingerprint spanning full width.
      Two broad overlapping bands (typical NIR O-H / C-H combination region).
      Positioned in the lower-middle of the icon so bars are still visible above.
    -->
    <!-- Dark shadow pass for legibility over bright amber bars -->
    <path d="M 0,230
             C 25,230 45,170 65,162
             C 80,156 88,205 108,200
             C 125,195 135,128 160,120
             C 180,113 192,170 215,165
             C 235,160 260,200 300,198"
          fill="none"
          stroke="rgba(0,0,0,0.35)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- White curve -->
    <path d="M 0,230
             C 25,230 45,170 65,162
             C 80,156 88,205 108,200
             C 125,195 135,128 160,120
             C 180,113 192,170 215,165
             C 235,160 260,200 300,198"
          fill="none"
          stroke="white"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#curveGlow)"/>
  </g>
</svg>
