[build-system]
requires = ["uv-build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "enginir"
version = "1.0.1"
description = "engiNIR: chemometric tools and project-backed workflows for NIR spectra and hyperspectral imaging"
readme = "README.md"
authors = [{ name = "Johannes Poms" }]
requires-python = ">=3.12"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.6",
    "matplotlib>=3.9.2",
    "h5py>=3.12.1",
    "openpyxl>=3.1",
    "pyqtgraph>=0.13",
    "pyqt6>=6.10.2",
    "loguru>=0.7",
    "qt-material>=2.17",
    "hdf5plugin>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    # Lint and type-check versions the code is verified against; newer releases
    # change rules and inference, so bump them deliberately.
    "ruff==0.15.4",
    "mypy",
    "pyright==1.1.410",
    "pytest-timeout>=2.3",
]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[project.urls]
Documentation = "https://enginir.readthedocs.io"
Repository = "https://github.com/TUstudents/engiNIR"
DOI = "https://doi.org/10.5281/zenodo.23235907"

[project.scripts]
enginir-viewer = "enginir.viewer.__main__:main"

[tool.uv-build]
include = ["src/enginir/_resources/*.ico", "src/enginir/viewer/themes/*.xml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src/enginir"]
exclude = [
    "tests",
    "docs/_build",
    "docs/superpowers",
    "notebooks",
    "data",
    "plan",
    ".venv",
]
# Check against the oldest supported Python, so newer standard-library APIs
# are reported.
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload -p timeout"
# A test that blocks (e.g. on a modal Qt dialog) fails with a traceback instead of
# hanging the run.
timeout = 60
